name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          AUTH_SECRET: build-time-placeholder-set-auth-secret-in-cloudflare

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_LOGIN_ID: ${{ secrets.ADMIN_LOGIN_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        run: |
          for name in AUTH_SECRET SUPABASE_SECRET_KEY SUPABASE_DB_PASSWORD DATABASE_URL ADMIN_PASSWORD ADMIN_LOGIN_ID ADMIN_EMAIL HEALTHCHECK_TOKEN SMTP_USER SMTP_APP_PASSWORD SMTP_FROM_NAME; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name" || echo "warn: failed $name"
            fi
          done

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
