name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          AUTH_SECRET: build-time-placeholder-set-auth-secret-in-cloudflare

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL AUTH_SECRET ADMIN_PASSWORD; do
            val="${!name:-}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
            printf '%s' "$val" | npx wrangler secret put "$name"
          done

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
